<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RackTrack Trace</title>
<link rel="stylesheet" href="trace.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <h1>RackTrack Trace</h1>
      <p>How a rack was identified, what was compared, and what became of the check. Read only.</p>
    </div>
    <div class="who" id="who"></div>
    <div class="sidehead">Scans</div>
    <div class="scans" id="scans"><p class="muted pad">Loading</p></div>
  </aside>
  <main class="main" id="main">
    <div class="empty">
      <h2>Pick a scan</h2>
      <p>Every scan this account can see is listed on the left, newest first.</p>
    </div>
  </main>
</div>
<script src="trace.js"></script>
</body>
</html>
