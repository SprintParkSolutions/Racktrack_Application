<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale / user-scalable=no: pinning the scale blocks pinch-zoom
         app-wide, which is the one accommodation a technician squinting at a
         port label in a dark aisle actually needs. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- color-scheme is set on :root in index.css too, but the Android WebView
         applies force-dark BEFORE the stylesheet loads, inverting light
         surfaces to black on first paint (the marketplace For sale / Wanted
         control especially) until a tap forced a repaint. Declaring it as a
         meta tag here — read before any CSS — stops the first-paint blackout. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>RackTrack</title>
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <!-- Fonts are self-hosted in src/fonts.css. They used to be three
         render-blocking stylesheets from fonts.googleapis.com, which made an
         external host a hard dependency of first paint — offline, on a captive
         portal, or on a datacenter network that blocks it, the app showed
         nothing until the request timed out. -->
  </head>
  <body>
    <!-- Static markup inside #root, replaced the moment React mounts. Without
         it the page is a blank white rectangle for the whole download-and-parse
         window — visually identical to the crash white-screens, so users
         concluded the app was dead and force-quit, restarting the download. -->
    <div id="root">
      <div id="boot" role="status" aria-label="Loading RackTrack">
        <div id="boot-mark"></div>
        <div id="boot-bar"><i></i></div>
      </div>
    </div>
    <style>
      #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:18px;background:#fff}
      #boot-mark{width:44px;height:44px;border-radius:10px;background:#111;
        -webkit-mask:radial-gradient(circle at 50% 50%,#000 99%,transparent) 0 0/100% 100%}
      #boot-bar{width:132px;height:3px;border-radius:2px;background:#e9e9e9;overflow:hidden}
      #boot-bar i{display:block;width:40%;height:100%;background:#111;border-radius:2px;
        animation:boot-slide 1.1s ease-in-out infinite}
      @keyframes boot-slide{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
      @media (prefers-reduced-motion:reduce){#boot-bar i{animation:none;width:100%;opacity:.35}}
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
