<script>
(function(){
'use strict';

// ---------- NetBox choice lists (values are NetBox's own) ----------
const C = {
  ifType: [['1000base-t','1G RJ45'],['100base-tx','100M RJ45'],['2.5gbase-t','2.5G RJ45'],['10gbase-t','10G RJ45'],['1000base-x-sfp','1G SFP'],['10gbase-x-sfpp','10G SFP+'],['25gbase-x-sfp28','25G SFP28'],['40gbase-x-qsfpp','40G QSFP+'],['100gbase-x-qsfp28','100G QSFP28'],['lag','LAG'],['virtual','Virtual'],['other','Other']],
  portType: [['8p8c','RJ45 (8P8C)'],['lc','LC'],['lc-upc','LC/UPC'],['sc','SC'],['mpo','MPO'],['other','Other']],
  ppType: [['iec-60320-c14','IEC C14'],['iec-60320-c20','IEC C20'],['nema-5-15p','NEMA 5-15P'],['nema-l6-30p','NEMA L6-30P'],['other','Other']],
  poType: [['iec-60320-c13','IEC C13'],['iec-60320-c19','IEC C19'],['nema-5-15r','NEMA 5-15R'],['other','Other']],
  cableType: [['cat5e','Cat5e'],['cat6','Cat6'],['cat6a','Cat6a'],['dac-passive','DAC passive'],['dac-active','DAC active'],['mmf-om3','MMF OM3'],['mmf-om4','MMF OM4'],['smf-os2','SMF OS2'],['power','Power'],['other','Other']],
  cableStatus: [['connected','Connected'],['planned','Planned'],['decommissioning','Decommissioning']],
  devStatus: [['active','Active'],['planned','Planned'],['staged','Staged'],['offline','Offline'],['failed','Failed'],['decommissioning','Decommissioning']],
  rackStatus: [['active','Active'],['planned','Planned'],['reserved','Reserved'],['available','Available'],['deprecated','Deprecated']],
  rackForm: [['4-post-cabinet','4-post cabinet'],['4-post-frame','4-post frame'],['2-post-frame','2-post frame'],['wall-frame','Wall frame'],['wall-cabinet','Wall cabinet']],
  width: [['19','19 inch'],['21','21 inch'],['23','23 inch'],['10','10 inch']],
  face: [['front','Front'],['rear','Rear']],
  airflow: [['front-to-rear','Front to rear'],['rear-to-front','Rear to front'],['passive','Passive'],['','Unknown']],
  sideType: [['dcim.interface','Interface'],['dcim.frontport','Front port'],['dcim.rearport','Rear port'],['dcim.powerport','Power port'],['dcim.poweroutlet','Power outlet']],
  ifMode: [['','Access or none'],['access','Access'],['tagged','Tagged'],['tagged-all','Tagged all']],
  cRole: [['Administrative','Administrative'],['Technical','Technical'],['On-site','On-site'],['Escalation','Escalation'],['Vendor','Vendor']],
  cScope: [['site','Site'],['rack','Rack']],
  lengthUnit: [['m','m'],['cm','cm'],['ft','ft'],['in','in']],
};
const slug = s => String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

// ---------- state ----------
function blank(name){
  return {
    schema:'rackbook/1', updatedAt:'', title:name||'Rack',
    site:{name:'',slug:'',status:'active',facility:'',time_zone:'',physical_address:'',latitude:'',longitude:''},
    location:{name:'',slug:''},
    rack:{name:name||'',facility_id:'',status:'active',form_factor:'4-post-cabinet',width:'19',u_height:42,desc_units:false,serial:'',asset_tag:'',comments:''},
    manufacturers:[], device_types:[], device_roles:[{name:'Access switch',slug:'access-switch',color:'2196f3'},{name:'Patch panel',slug:'patch-panel',color:'9e9e9e'},{name:'PDU',slug:'pdu',color:'ff9800'}],
    devices:[], interfaces:[], rear_ports:[], front_ports:[], power_ports:[], power_outlets:[], inventory_items:[],
    vlans:[], prefixes:[], ip_addresses:[], cables:[], contacts:[],
  };
}
let S = blank('Rack');
let rackId = null;
let db = null, downloads = null;
let dirty = false, saveTimer = null;

const $ = (s,el)=> (el||document).querySelector(s);
const el = (tag, attrs, ...kids) => { const e=document.createElement(tag); for (const [k,v] of Object.entries(attrs||{})){ if(v==null) continue; if(k==='class') e.className=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else if(k==='html') e.innerHTML=v; else e.setAttribute(k,v);} for (const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(String(k))); } return e; };
function toast(t){ const x=$('#toast'); x.textContent=t; x.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>x.classList.remove('on'),1800); }
function setStatus(t,cls){ const s=$('#saveStatus'); s.textContent=t; s.className='status'+(cls?' '+cls:''); }

// ---------- persistence: db when available, localStorage always ----------
function lsKey(id){ return 'rackbook:'+id; }
function lsIndexKey(){ return 'rackbook:index'; }
function lsIndex(){ try{ return JSON.parse(localStorage.getItem(lsIndexKey())||'[]'); }catch(e){ return []; } }
function lsSetIndex(ids){ try{ localStorage.setItem(lsIndexKey(), JSON.stringify(ids)); }catch(e){} }

function markDirty(){ dirty=true; setStatus('unsaved'); clearTimeout(saveTimer); saveTimer=setTimeout(saveNow, 900); }
async function saveNow(){
  if(!rackId) return;
  S.updatedAt = new Date().toISOString();
  try{ localStorage.setItem(lsKey(rackId), JSON.stringify(S)); const ix=lsIndex(); if(!ix.includes(rackId)) lsSetIndex(ix.concat(rackId)); }catch(e){}
  if(db){
    try{ await db.doc('racks/'+rackId).set(JSON.parse(JSON.stringify(S))); dirty=false; setStatus('saved to the page database','ok'); }
    catch(e){ setStatus('saved on this device only','bad'); }
  } else { dirty=false; setStatus('saved on this device only'); }
  refreshRackList();
}
async function listRacks(){
  const ids=new Set(lsIndex());
  if(db){ try{ const q=await db.collection('racks').get(); q.docs.forEach(d=>ids.add(d.id)); }catch(e){} }
  return [...ids].sort();
}
async function loadRack(id){
  let data=null;
  if(db){ try{ const snap=await db.doc('racks/'+id).get(); if(snap.exists) data=JSON.parse(JSON.stringify(snap.data())); }catch(e){} }
  if(!data){ try{ data=JSON.parse(localStorage.getItem(lsKey(id))||'null'); }catch(e){} }
  if(!data) data=blank(id);
  S = Object.assign(blank(id), data);
  rackId=id; dirty=false; setStatus(db?'loaded':'loaded from this device');
  try{ localStorage.setItem('rackbook:last', id); }catch(e){}
  renderAll();
}
async function refreshRackList(){
  const sel=$('#rackSel'); const ids=await listRacks(); sel.innerHTML='';
  ids.forEach(id=>sel.append(el('option',{value:id, selected: id===rackId?'':null}, id)));
  if(rackId && !ids.includes(rackId)) sel.append(el('option',{value:rackId,selected:''},rackId));
}

// ---------- generic table editor ----------
// cols: {key,label,type:'text'|'num'|'sel'|'chk', opts:[[v,l]] | ()=>[[v,l]], w, ph}
function table(listKey, cols, opts){
  opts=opts||{};
  const rows=S[listKey];
  const wrap=el('div');
  const scroll=el('div',{class:'tscroll'});
  const t=el('table',{class:'ed'});
  const thead=el('tr'); thead.append(el('th',{},'#')); cols.forEach(c=>thead.append(el('th',{style:c.w?('min-width:'+c.w+'px'):''},c.label))); thead.append(el('th',{},''));
  t.append(el('thead',{},thead));
  const tb=el('tbody');
  rows.forEach((r,i)=>{
    const tr=el('tr'); tr.append(el('td',{class:'n'},String(i+1)));
    cols.forEach(c=>{
      let inp;
      const o=typeof c.opts==='function'?c.opts(r):c.opts;
      if(c.type==='sel'){ inp=el('select'); (c.blank?[['','']]:[]).concat(o||[]).forEach(([v,l])=>inp.append(el('option',{value:v, selected: String(r[c.key]??'')===String(v)?'':null},l||v))); if(r[c.key]!=null && r[c.key]!=='' && !(o||[]).some(([v])=>String(v)===String(r[c.key]))) { inp.append(el('option',{value:r[c.key],selected:''},String(r[c.key]))); } inp.addEventListener('change',()=>{ r[c.key]=inp.value; if(c.after) c.after(r); markDirty(); if(opts.rerenderOn && opts.rerenderOn.includes(c.key)) rerender(listKey); }); }
      else if(c.type==='chk'){ inp=el('input',{type:'checkbox'}); inp.checked=!!r[c.key]; inp.addEventListener('change',()=>{ r[c.key]=inp.checked; markDirty(); }); }
      else { inp=el('input',{type:'text', class:c.type==='num'?'num':'', placeholder:c.ph||''}); inp.value=r[c.key]??''; inp.addEventListener('input',()=>{ r[c.key]= c.type==='num' ? (inp.value===''?'':Number(inp.value)) : inp.value; if(c.after) c.after(r); markDirty(); }); inp.addEventListener('change',()=>{ if(opts.rerenderOn && opts.rerenderOn.includes(c.key)) rerender(listKey); }); }
      tr.append(el('td',{},inp));
    });
    tr.append(el('td',{class:'x'}, el('button',{class:'del',title:'Remove row',onclick:()=>{ rows.splice(i,1); markDirty(); rerender(listKey); }},'×')));
    tb.append(tr);
  });
  t.append(tb); scroll.append(t); wrap.append(scroll);
  const bar=el('div',{class:'bar'});
  bar.append(el('button',{class:'btn',onclick:()=>{ rows.push(Object.assign({}, opts.blankRow?opts.blankRow():{})); markDirty(); rerender(listKey); }},'+ Add row'));
  if(opts.extra) opts.extra.forEach(b=>bar.append(b));
  wrap.append(bar);
  return wrap;
}
const rerenderers={};
function rerender(listKey){ (rerenderers[listKey]||[]).forEach(fn=>fn()); renderElevation(); }
function mount(host, listKey, build){ const box=el('div'); const fn=()=>{ box.innerHTML=''; box.append(build()); }; (rerenderers[listKey]=rerenderers[listKey]||[]).push(fn); fn(); host.append(box); return box; }

// option helpers
const devOpts = ()=> S.devices.map(d=>[d.name,d.name]).filter(([v])=>v);
const dtOpts = ()=> S.device_types.map(t=>[t.model,t.manufacturer+' '+t.model]).filter(([v])=>v);
const mfrOpts= ()=> S.manufacturers.map(m=>[m.name,m.name]).filter(([v])=>v);
const roleOpts=()=> S.device_roles.map(r=>[r.name,r.name]).filter(([v])=>v);
const vlanOpts=()=> S.vlans.map(v=>[String(v.vid),v.vid+' '+(v.name||'')]).filter(([v])=>v && v!=='undefined');
const portsOf = (dev,type)=>{
  const list = type==='dcim.frontport'?S.front_ports : type==='dcim.rearport'?S.rear_ports : type==='dcim.powerport'?S.power_ports : type==='dcim.poweroutlet'?S.power_outlets : S.interfaces;
  return list.filter(p=>p.device===dev).map(p=>[p.name,p.name]);
};
const ifOpts = r => portsOf(r.device,'dcim.interface');
const rpOpts = r => S.rear_ports.filter(p=>p.device===r.device).map(p=>[p.name,p.name]);
const ppOpts = r => S.power_ports.filter(p=>p.device===r.device).map(p=>[p.name,p.name]);

// ---------- field groups ----------
function field(obj, key, label, type, opts, extra){
  const lab=el('label',{class:'f'}); lab.append(el('b',{},label));
  let inp;

function renderElevation(){
  const host=$('#elevHost'); if(!host) return;
  const H=Math.max(1,Number(S.rack.u_height)||42); const rowH=14, W=272, top=6;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('viewBox',`0 0 ${W} ${top+H*rowH+6}`);
  const y=u=> top+(H-u)*rowH;
  for(let u=1;u<=H;u++){ const r=document.createElementNS('http://www.w3.org/2000/svg','rect'); r.setAttribute('x',30); r.setAttribute('y',y(u)); r.setAttribute('width',W-36); r.setAttribute('height',rowH); r.setAttribute('class','u'); svg.append(r); const t=document.createElementNS('http://www.w3.org/2000/svg','text'); t.setAttribute('x',24); t.setAttribute('y',y(u)+10); t.setAttribute('text-anchor','end'); t.setAttribute('class','un'); t.textContent='U'+u; svg.append(t); }
  const taken=new Map();

    if(d.position==='' || d.position==null) return; const pos=Number(d.position); const dt=S.device_types.find(t=>t.model===d.device_type); const span=Math.max(1,Number(dt&&dt.u_height)||1);
    let bad=false; for(let u=pos;u<pos+span;u++){ if(u<1||u>H||taken.has(u)) bad=true; taken.set(u,d.name); }
    const r=document.createElementNS('http://www.w3.org/2000/svg','rect'); r.setAttribute('x',31); r.setAttribute('y',y(pos+span-1)+1); r.setAttribute('width',W-38); r.setAttribute('height',rowH*span-2); r.setAttribute('rx',2);
    const role=(d.role||'').toLowerCase(); r.setAttribute('class','dev'+(bad?' bad':role.includes('patch')?' pp':role.includes('pdu')||role.includes('power')?' pdu':'')); svg.append(r);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text'); t.setAttribute('x',36); t.setAttribute('y',y(pos+span-1)+10); t.textContent=(d.name||'(unnamed)')+(dt?'  '+dt.model:''); svg.append(t);
  });
  host.innerHTML=''; host.append(svg);
}

function checks(){
  const out=[]; const add=(cls,msg)=>out.push({cls,msg});
  if(!S.site.name) add('bad','Site name is empty'); if(!S.rack.name) add('bad','Rack name is empty');
  if(!Number.isInteger(Number(S.rack.u_height))||Number(S.rack.u_height)<1) add('bad','Rack height must be a whole number of U');
  const names=new Set(); S.devices.forEach(d=>{ if(!d.name) add('bad','A device has no name'); else if(names.has(d.name)) add('bad','Device name repeated: '+d.name); names.add(d.name); if(!d.device_type) add('bad',(d.name||'a device')+' has no device type'); if(!d.role) add('warn',(d.name||'a device')+' has no role'); if(d.device_type && !S.device_types.some(t=>t.model===d.device_type)) add('bad',d.name+' points at a device type that does not exist'); });
  const H=Number(S.rack.u_height)||0; const taken=new Map();
  S.devices.forEach(d=>{ if(d.position===''||d.position==null) { add('warn',(d.name||'a device')+' has no position'); return;} const pos=Number(d.position); const dt=S.device_types.find(t=>t.model===d.device_type); const span=Math.max(1,Number(dt&&dt.u_height)||1); for(let u=pos;u<pos+span;u++){ if(u<1||u>H) add('bad',d.name+' sits outside U1 to U'+H); else if(taken.has(u)) add('bad',d.name+' overlaps '+taken.get(u)+' at U'+u); taken.set(u,d.name);} });
  const ifKeys=new Set(); S.interfaces.forEach(i=>{ const k=i.device+'|'+i.name; if(!i.device||!i.name) add('bad','An interface has no device or name'); else if(ifKeys.has(k)) add('bad','Interface repeated: '+k); ifKeys.add(k); if(i.device && !names.has(i.device)) add('bad','Interface on unknown device '+i.device); });
  S.cables.forEach((c,i)=>{ for(const s of ['a','b']){ const dev=c['side_'+s+'_device'], nm=c['side_'+s+'_name'], ty=c['side_'+s+'_type']; if(!dev||!nm) { add('bad','Cable '+(i+1)+' side '+s.toUpperCase()+' is incomplete'); continue; } if(!portsOf(dev,ty).some(([v])=>v===nm)) add('bad','Cable '+(i+1)+': '+dev+' has no '+ty.replace('dcim.','')+' named '+nm); } if(c.color && !/^[0-9a-f]{6}$/.test(c.color)) add('bad','Cable '+(i+1)+' colour must be six lower-case hex digits'); });
  const ends=new Map(); S.cables.forEach((c,i)=>{ for(const s of ['a','b']){ const k=c['side_'+s+'_device']+'|'+c['side_'+s+'_type']+'|'+c['side_'+s+'_name']; if(ends.has(k)) add('bad','Port used by two cables: '+k.replace(/\|/g,' ')); ends.set(k,i);} });
  S.devices.forEach(d=>{ if(!d.serial) add('warn',d.name+' has no serial'); });
  const prim=new Map(); S.ip_addresses.forEach(a=>{ if(a.is_primary&&a.device){ if(prim.has(a.device)) add('warn',a.device+' has two primary addresses'); prim.set(a.device,1);} });
  if(!out.length) add('ok','Everything checks out');
  return out;
}

// ---------- exports ----------
const csvEsc = v => { const s = v==null?'':String(v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
const toCSV = (cols, rows) => [cols.join(',')].concat(rows.map(r=>cols.map(c=>csvEsc(typeof r[c]==='boolean'?(r[c]?'true':'false'):r[c])).join(','))).join('\n')+'\n';
const loc = ()=> S.location.name||'';
function netboxTables(){
  const site=S.site.name, rack=S.rack.name;
  const T={};
  T['01-sites']=[['name','slug','status','facility','time_zone','physical_address','latitude','longitude'],[{name:site,slug:S.site.slug||slug(site),status:S.site.status||'active',facility:S.site.facility,time_zone:S.site.time_zone,physical_address:S.site.physical_address,latitude:S.site.latitude,longitude:S.site.longitude}]];
  if(loc()) T['02-locations']=[['site','name','slug','status'],[{site,name:loc(),slug:S.location.slug||slug(loc()),status:'active'}]];
  T['03-manufacturers']=[['name','slug'],S.manufacturers.map(m=>({name:m.name,slug:m.slug||slug(m.name)}))];
  T['04-device_types']=[['manufacturer','model','slug','part_number','u_height','is_full_depth','airflow'],S.device_types.map(t=>({manufacturer:t.manufacturer,model:t.model,slug:t.slug||slug(t.manufacturer+' '+t.model),part_number:t.part_number,u_height:t.u_height,is_full_depth:!!t.is_full_depth,airflow:t.airflow}))];
  T['05-device_roles']=[['name','slug','color'],S.device_roles.map(r=>({name:r.name,slug:r.slug||slug(r.name),color:r.color}))];
  T['06-racks']=[['site','location','name','facility_id','status','form_factor','width','u_height','desc_units','serial','asset_tag','comments'],[{site,location:loc(),name:rack,facility_id:S.rack.facility_id,status:S.rack.status,form_factor:S.rack.form_factor,width:S.rack.width,u_height:S.rack.u_height,desc_units:!!S.rack.desc_units,serial:S.rack.serial,asset_tag:S.rack.asset_tag,comments:S.rack.comments}]];
  T['07-devices']=[['name','role','device_type','site','location','rack','position','face','status','serial','asset_tag','platform','comments'],S.devices.map(d=>({name:d.name,role:d.role,device_type:d.device_type,site,location:loc(),rack,position:d.position,face:d.position===''||d.position==null?'':d.face,status:d.status,serial:d.serial,asset_tag:d.asset_tag,platform:d.platform,comments:d.comments}))];
  T['08-interfaces']=[['device','name','type','enabled','mgmt_only','mac_address','mode','untagged_vlan','description'],S.interfaces.map(i=>({device:i.device,name:i.name,type:i.type,enabled:!!i.enabled,mgmt_only:!!i.mgmt_only,mac_address:i.mac_address,mode:i.mode,untagged_vlan:i.untagged_vlan,description:i.description}))];
  T['09-rear_ports']=[['device','name','type','positions'],S.rear_ports];
  T['10-front_ports']=[['device','name','type','rear_port','rear_port_position'],S.front_ports];
  T['11-power_ports']=[['device','name','type','maximum_draw','allocated_draw'],S.power_ports];
  T['12-power_outlets']=[['device','name','type','power_port','feed_leg'],S.power_outlets];
  T['13-inventory_items']=[['device','name','manufacturer','part_id','serial','asset_tag','component_type','component_name'],S.inventory_items];
  T['14-vlans']=[['site','vid','name','status'],S.vlans.map(v=>({site,vid:v.vid,name:v.name,status:v.status}))];
  T['15-prefixes']=[['prefix','status','site','vlan','description'],S.prefixes.map(p=>({prefix:p.prefix,status:p.status,site,vlan:p.vlan,description:p.description}))];
  T['16-ip_addresses']=[['address','status','dns_name','device','interface','is_primary'],S.ip_addresses.map(a=>({address:a.address,status:a.status,dns_name:a.dns_name,device:a.device,interface:a.interface,is_primary:!!a.is_primary}))];
  T['17-cables']=[['side_a_device','side_a_type','side_a_name','side_b_device','side_b_type','side_b_name','type','status','label','color','length','length_unit'],S.cables];
  T['18-contacts']=[['name','title','phone','email','role','assigned_to'],S.contacts];
  return T;
}
async function save(filename, data){
  if(downloads){ try{ await downloads.save({filename,data}); toast('Saved '+filename); return; }catch(e){ if(e&&e.code==='declined') return; toast('Could not save: '+(e&&e.code||'error')); return; } }
  // fallback: show in a textarea to copy
  const ta=$('#fallback'); if(ta){ ta.value = typeof data==='string'?data:'(binary file: downloads are not available in this view)'; ta.focus(); ta.select(); toast('Downloads unavailable here: copy from the box below'); }
}
async function zipOf(files){ const z=new JSZip(); for(const [n,c] of Object.entries(files)) z.file(n,c); return await z.generateAsync({type:'blob'}); }
const stamp = ()=> slug(S.rack.name||'rack');

async function exportNetboxCsv(){
  const T=netboxTables(); const files={};
  files['00-README.txt']='NetBox bulk import, one file per object type, in this order.\nIn NetBox: the object list page > Import > paste the CSV.\nSkip files with only a header row.\n\n'+Object.keys(T).map(k=>k+'.csv').join('\n')+'\n\nContacts (18) are plain contacts; assign them to the site or rack after import.\n';
  for(const [k,[cols,rows]] of Object.entries(T)) files[k+'.csv']=toCSV(cols,rows);
  await save(stamp()+'-netbox-csv.zip', await zipOf(files));
}
async function exportNetboxJson(){
  const T=netboxTables(); const bundle={schema:'rackbook/netbox-bundle/1',generated:new Date().toISOString(),rack:S.rack.name,site:S.site.name,objects:{}};
  for(const [k,[cols,rows]] of Object.entries(T)) bundle.objects[k.replace(/^\d+-/,'')]=rows.map(r=>Object.fromEntries(cols.map(c=>[c,r[c]??''])));
  await save(stamp()+'-netbox-bundle.json', JSON.stringify(bundle,null,2));
}
function yamlStr(v){ v=String(v??''); return /^[\w./+-]+$/.test(v)&&v!==''?v:JSON.stringify(v); }
async function exportDeviceTypes(){
  const files={};
  S.device_types.forEach(t=>{
    const dev=S.devices.find(d=>d.device_type===t.model);
    let y=`manufacturer: ${yamlStr(t.manufacturer)}\nmodel: ${yamlStr(t.model)}\nslug: ${yamlStr(t.slug||slug(t.manufacturer+' '+t.model))}\n`;
    if(t.part_number) y+=`part_number: ${yamlStr(t.part_number)}\n`;
    y+=`u_height: ${Number(t.u_height)||1}\nis_full_depth: ${t.is_full_depth?'true':'false'}\n`;
    if(t.airflow) y+=`airflow: ${t.airflow}\n`;
    const sec=(title,rows,fmt)=>{ if(!rows.length) return; y+=title+':\n'; rows.forEach(r=>{ y+=fmt(r); }); };
    if(dev){
      sec('interfaces',S.interfaces.filter(i=>i.device===dev.name),i=>`  - name: ${yamlStr(i.name)}\n    type: ${i.type}\n${i.mgmt_only?'    mgmt_only: true\n':''}`);
      sec('rear-ports',S.rear_ports.filter(i=>i.device===dev.name),i=>`  - name: ${yamlStr(i.name)}\n    type: ${i.type}\n    positions: ${Number(i.positions)||1}\n`);
      sec('front-ports',S.front_ports.filter(i=>i.device===dev.name),i=>`  - name: ${yamlStr(i.name)}\n    type: ${i.type}\n    rear_port: ${yamlStr(i.rear_port)}\n    rear_port_position: ${Number(i.rear_port_position)||1}\n`);
      sec('power-ports',S.power_ports.filter(i=>i.device===dev.name),i=>`  - name: ${yamlStr(i.name)}\n    type: ${i.type}\n`);
      sec('power-outlets',S.power_outlets.filter(i=>i.device===dev.name),i=>`  - name: ${yamlStr(i.name)}\n    type: ${i.type}\n${i.power_port?'    power_port: '+yamlStr(i.power_port)+'\n':''}`);
    }
    files[slug(t.manufacturer)+'/'+(slug(t.part_number||t.model))+'.yaml']=y;
  });
  if(!Object.keys(files).length) return toast('No device types yet');
  await save(stamp()+'-device-types.zip', await zipOf(files));
}
async function exportXlsx(){
  const T=netboxTables(); const wb=XLSX.utils.book_new();
  for(const [k,[cols,rows]] of Object.entries(T)){ const ws=XLSX.utils.json_to_sheet(rows.map(r=>Object.fromEntries(cols.map(c=>[c,r[c]??'']))),{header:cols}); XLSX.utils.book_append_sheet(wb,ws,k.replace(/^\d+-/,'').slice(0,31)); }
  const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  await save(stamp()+'-rack-book.xlsx', new Blob([buf],{type:'application/octet-stream'}));
}
async function exportServiceNow(){
  const files={};
  files['00-README.txt']='ServiceNow import sets, one CSV per class. Map columns in the Transform Map; names are the coalesce fields.\n';
  files['cmdb_ci_rack.csv']=toCSV(['name','location','rack_units','serial_number','asset_tag','u_facility_id'],[{name:S.rack.name,location:S.site.name,rack_units:S.rack.u_height,serial_number:S.rack.serial,asset_tag:S.rack.asset_tag,u_facility_id:S.rack.facility_id}]);
  const cls=r=>{ const s=(r||'').toLowerCase(); if(s.includes('patch')) return 'cmdb_ci_patch_panel'; if(s.includes('pdu')||s.includes('power')) return 'cmdb_ci_pdu'; if(s.includes('server')) return 'cmdb_ci_server'; if(s.includes('fire')) return 'cmdb_ci_ip_firewall'; if(s.includes('router')) return 'cmdb_ci_ip_router'; return 'cmdb_ci_ip_switch'; };
  files['cmdb_ci_hardware.csv']=toCSV(['name','sys_class_name','manufacturer','model_id','serial_number','asset_tag','location','rack','rack_unit_position','u_height','install_status','ip_address'],S.devices.map(d=>{ const t=S.device_types.find(x=>x.model===d.device_type)||{}; const ip=S.ip_addresses.find(a=>a.device===d.name&&a.is_primary); return {name:d.name,sys_class_name:cls(d.role),manufacturer:t.manufacturer||'',model_id:d.device_type,serial_number:d.serial,asset_tag:d.asset_tag,location:S.site.name,rack:S.rack.name,rack_unit_position:d.position,u_height:t.u_height||'',install_status:d.status==='active'?'1':'7',ip_address:ip?ip.address.split('/')[0]:''}; }));
  files['cmdb_ci_network_adapter.csv']=toCSV(['name','cmdb_ci','mac_address','ip_address','netmask'],S.interfaces.map(i=>{ const ip=S.ip_addresses.find(a=>a.device===i.device&&a.interface===i.name); return {name:i.name,cmdb_ci:i.device,mac_address:i.mac_address,ip_address:ip?ip.address.split('/')[0]:'',netmask:''}; }));
  files['sys_user_contacts.csv']=toCSV(['name','title','email','phone','u_role','u_assigned_to'],S.contacts.map(c=>({name:c.name,title:c.title,email:c.email,phone:c.phone,u_role:c.role,u_assigned_to:c.assigned_to==='rack'?S.rack.name:S.site.name})));
  await save(stamp()+'-servicenow-csv.zip', await zipOf(files));
}
async function exportAsBuilt(){
  const key=d=>slug(d.name).toUpperCase().replace(/-/g,'');
  const doc={ $schema:'racktrack-asbuilt/1', source:{file:'rack-book/'+stamp(),transcribed:new Date().toISOString().slice(0,10),note:'Entered by hand in the Rack Book page'},
    site:{code:S.site.slug||slug(S.site.name),name:S.site.name}, rack:{name:S.rack.name,uHeight:Number(S.rack.u_height)||42,description:S.rack.comments||''},
    manufacturers:S.manufacturers.map(m=>({name:m.name,slug:m.slug||slug(m.name),source:'rack book'})),
    deviceTypes:S.device_types.map(t=>({key:slug(t.part_number||t.model),manufacturer:t.manufacturer,model:t.model,uHeight:Number(t.u_height)||1,source:'rack book'})),
    roles:S.device_roles.map(r=>({name:r.name,source:'rack book'})),
    devices:S.devices.map(d=>{ const t=S.device_types.find(x=>x.model===d.device_type)||{}; const k=key(d); const isPanel=(d.role||'').toLowerCase().includes('patch'); return { key:k,name:d.name,type:slug(t.part_number||t.model||''),role:d.role,rack:true,position:d.position===''||d.position==null?null:Number(d.position),serial:d.serial||null,assetTag:d.asset_tag||null,description:d.comments||'',
      interfaces:isPanel?[]:S.interfaces.filter(i=>i.device===d.name).map(i=>({name:i.name,type:i.type,description:i.description||''})),
      panelPorts:isPanel?S.front_ports.filter(p=>p.device===d.name).map(p=>p.name):[], source:'rack book' }; }),
    cables:S.cables.map(c=>({a:[key({name:c.side_a_device}),c.side_a_name],b:[key({name:c.side_b_device}),c.side_b_name],type:c.type,color:c.color||null,label:c.label||null,status:c.status||'connected',description:'',source:'rack book'})),
    prefixes:S.prefixes.map(p=>({prefix:p.prefix,description:p.description||''})),
    held:[] };
  await save(stamp()+'-racktrack-asbuilt.json', JSON.stringify(doc,null,2));
}
async function exportMarkdown(){
  const H=Number(S.rack.u_height)||42; const byU=new Map();
  S.devices.forEach(d=>{ if(d.position===''||d.position==null) return; const t=S.device_types.find(x=>x.model===d.device_type)||{}; byU.set(Number(d.position),{d,t}); });
  let md=`# ${S.rack.name}\n\nSite: ${S.site.name}${loc()?' / '+loc():''}  \nHeight: ${H}U  \nGenerated: ${new Date().toISOString().slice(0,16).replace('T',' ')}\n\n## Elevation\n\n| U | Device | Type | Serial | Asset tag |\n|---|---|---|---|---|\n`;
  const covered=new Set();
  for(let u=H;u>=1;u--){ if(covered.has(u)) continue; const hit=[...byU.entries()].find(([pos,{t}])=>u>=pos && u<pos+Math.max(1,Number(t.u_height)||1)); if(hit){ const [pos,{d,t}]=hit; const span=Math.max(1,Number(t.u_height)||1); for(let k=pos;k<pos+span;k++) covered.add(k); md+=`| U${pos}${span>1?'-U'+(pos+span-1):''} | ${d.name} | ${t.manufacturer||''} ${t.model||''} | ${d.serial||''} | ${d.asset_tag||''} |\n`; } else md+=`| U${u} | | | | |\n`; }
  md+=`\n## Cables\n\n| A | B | Type | Colour | Label |\n|---|---|---|---|---|\n`+S.cables.map(c=>`| ${c.side_a_device} ${c.side_a_name} | ${c.side_b_device} ${c.side_b_name} | ${c.type} | ${c.color} | ${c.label||''} |`).join('\n')+'\n';
  md+=`\n## Addresses\n\n`+S.ip_addresses.map(a=>`- ${a.device} ${a.interface||''}: ${a.address}${a.is_primary?' (primary)':''}`).join('\n')+'\n';
  md+=`\n## Contacts\n\n`+S.contacts.map(c=>`- ${c.name}, ${c.role}, ${c.assigned_to}: ${c.email||''} ${c.phone||''}`).join('\n')+'\n';
  await save(stamp()+'-rack-elevation.md', md);
}

function buildExport(){
  const w=el('div');
  w.append(el('div',{class:'sec-head'},el('h2',{},'Check and export')));
  w.append(el('p',{class:'lede'},'Every export is built from the same entries. Fix what the checks flag first; NetBox refuses overlaps and unknown ports at import time, after the objects above them are already written.'));
  const ul=el('ul',{class:'checks'}); checks().forEach(c=>ul.append(el('li',{class:c.cls},el('b',{},c.cls==='ok'?'ok':c.cls==='bad'?'fix':'note'),c.msg))); w.append(ul);
  const cards=el('div',{class:'cards'});
  const card=(fmt,title,text,fn)=>{ const c=el('div',{class:'card'}); c.append(el('span',{class:'fmt'},fmt),el('h4',{},title),el('p',{},text),el('button',{class:'btn primary',onclick:fn},'Save')); return c; };
  cards.append(card('zip of csv','NetBox bulk import','One CSV per object type in NetBox\'s own import columns, numbered in the order NetBox needs them.',exportNetboxCsv));
  cards.append(card('json','NetBox bundle','Every object with natural keys in one file, for a scripted load with pynetbox.',exportNetboxJson));
  cards.append(card('zip of yaml','Device-type library','One YAML per model in the public devicetype-library format, with the port templates taken from the first device of each type.',exportDeviceTypes));
  cards.append(card('xlsx','Workbook','One sheet per object type, for whoever prefers a spreadsheet.',exportXlsx));
  cards.append(card('zip of csv','ServiceNow import sets','Rack, hardware by class, network adapters and contacts, ready for an import set and transform map.',exportServiceNow));
  cards.append(card('json','RackTrack as-built','The document our own writer reads, so the same rack can be loaded through RackTrack directly.',exportAsBuilt));
  cards.append(card('md','Elevation summary','A readable rack elevation with serials, cables, addresses and contacts.',exportMarkdown));
  w.append(cards);
  w.append(el('h3',{},'Backup and restore the whole book'));
  const bar=el('div',{class:'bar'});
  bar.append(el('button',{class:'btn',onclick:()=>save(stamp()+'-rack-book.json',JSON.stringify(S,null,2))},'Save the book as JSON'));
  bar.append(el('button',{class:'btn',onclick:()=>{ const ta=$('#fallback'); try{ const d=JSON.parse(ta.value); if(d.schema!=='rackbook/1') throw new Error('not a rack book'); S=Object.assign(blank(rackId),d); markDirty(); renderAll(); toast('Book restored'); }catch(e){ toast('Paste a rack book JSON first'); } }},'Restore from the box below'));
  w.append(bar);
  w.append(el('textarea',{id:'fallback',class:'io',placeholder:'Exports appear here when downloads are unavailable. Paste a saved book here to restore it.'}));
  return w;
}

// ---------- boot ----------
async function boot(){
  $('#rackSel').addEventListener('change',e=>loadRack(e.target.value));
  $('#newRack').addEventListener('click',async()=>{ const name=prompt('Rack name (as printed on it)'); if(!name) return; const id=slug(name); if(!id) return; S=blank(name); rackId=id; renderAll(); await saveNow(); await refreshRackList(); $('#rackSel').value=id; });
  $('#delRack').addEventListener('click',async()=>{ if(!rackId) return; if(!confirm('Delete the book for '+rackId+'? This cannot be undone.')) return; try{ localStorage.removeItem(lsKey(rackId)); lsSetIndex(lsIndex().filter(x=>x!==rackId)); }catch(e){} if(db){ try{ await db.doc('racks/'+rackId).delete(); }catch(e){} } rackId=null; const ids=await listRacks(); if(ids.length) await loadRack(ids[0]); else { S=blank('Rack'); rackId=null; renderAll(); } await refreshRackList(); });
  window.addEventListener('beforeunload',e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });
  // render immediately from local storage, light up db when it answers
  let last=null; try{ last=localStorage.getItem('rackbook:last'); }catch(e){}
  const ids=lsIndex();
  if(last && ids.includes(last)) await loadRack(last); else if(ids.length) await loadRack(ids[0]); else { S=blank('Rack'); rackId=null; renderAll(); setStatus('create a rack to start'); }
  await refreshRackList();
  if(window.claude && window.claude.use){
    claude.use('db').then(async ns=>{ db=ns; if(!db){ setStatus('database unavailable: saving on this device only'); return; } const all=await listRacks(); await refreshRackList(); if(!rackId && all.length) await loadRack(all[0]); else if(rackId) { /* prefer the shared copy if newer */ try{ const snap=await db.doc('racks/'+rackId).get(); if(snap.exists){ const d=snap.data(); if(d && d.updatedAt && (!S.updatedAt || d.updatedAt>S.updatedAt)) { S=Object.assign(blank(rackId),JSON.parse(JSON.stringify(d))); renderAll(); } } }catch(e){} setStatus('connected to the page database','ok'); } });
    claude.use('downloads').then(ns=>{ downloads=ns; });
  }
}
boot();
})();
