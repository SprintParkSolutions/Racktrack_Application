name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Node: server unit/smoke tests + client production build.
  # ---------------------------------------------------------------------------
  node:
    name: Node (server + client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- server ---
      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Lint server
        working-directory: server
        run: npm run lint --if-present

      - name: Test server
        working-directory: server
        run: npm test --if-present

      # --- client ---
      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Lint client
        working-directory: client
        run: npm run lint --if-present

      - name: Build client
        working-directory: client
        run: npm run build

  # ---------------------------------------------------------------------------
  # Python: install the CV/pipeline deps and smoke-import the heavy libraries.
  # The import is best-effort (continue-on-error) because it pulls torch and
  # does not have model weights available in CI — a green run only proves the
  # dependency set resolves and installs, not that inference works.
  # ---------------------------------------------------------------------------
  python:
    name: Python (pipeline deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.txt

      - name: Smoke import (best-effort)
        continue-on-error: true
        run: python -c "import ultralytics, torch, cv2; print('imports OK', torch.__version__)"
